module: components/model_zoo/vad

tests:
  - name: vad-config-and-backend-contract
    description: Verifies VAD presets, immutable config builders, streaming state transitions, and callback events with a fake backend.
    category: functional
    scopes: [pr]
    timeout_s: 60
    workdir: sdk
    command: |
      bash components/model_zoo/vad/tests/test_config_and_backend_contract.sh

  - name: vad-invalid-input-error-path
    description: Verifies invalid preset and invalid audio frame errors fail fast without reporting successful detections.
    category: functional
    scopes: [pr]
    timeout_s: 60
    workdir: sdk
    command: |
      bash components/model_zoo/vad/tests/test_invalid_input_error_path.sh
